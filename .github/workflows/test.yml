name: Test (unit + browser)

# Runs on every branch push and pull request, and by hand from the Actions tab.
# It never deploys: the live game is published only by deploy-pages.yml from main.
on:
  push:
    branches-ignore: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      specs:
        description: "Playwright specs to run (blank = all), e.g. menu loop"
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    name: Typecheck, unit tests, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      # The built game, for anyone who wants to run this branch locally.
      - uses: actions/upload-artifact@v4
        with:
          name: monster-island-build-${{ github.sha }}
          path: dist
          retention-days: 14

  browser:
    name: Playwright (Chromium, SwiftShader)
    needs: unit
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      CI: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Install Chromium for Playwright
        run: npx playwright install --with-deps chromium
      # A failure here is the test environment, not the game: no browser or no
      # WebGL (SwiftShader) means none of the game's tests can mean anything.
      - name: Check the browser environment (WebGL via SwiftShader)
        run: |
          node -e '
            const { chromium } = require("@playwright/test");
            (async () => {
              const b = await chromium.launch({ args: ["--use-angle=swiftshader", "--enable-unsafe-swiftshader", "--ignore-gpu-blocklist"] });
              const p = await b.newPage();
              const gl = await p.evaluate(() => { const c = document.createElement("canvas"); const g = c.getContext("webgl2") || c.getContext("webgl"); return g ? g.getParameter(g.VERSION) : null; });
              await b.close();
              if (!gl) { console.log("::error title=Test environment::WebGL is unavailable in this runner (not a game failure)"); process.exit(1); }
              console.log("WebGL:", gl);
            })().catch((e) => { console.log("::error title=Test environment::Chromium failed to start: " + e.message); process.exit(1); });
          '
      - run: npm run build
      - name: Run the browser tests
        run: npx playwright test ${{ github.event.inputs.specs }}
      - name: Keep traces and screenshots of failures
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-results-${{ github.sha }}
          path: test-results
          retention-days: 14
